apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-reports-config
  namespace: grafana-reports
data:
  config.yml: |
    timezone: "Europe/Prague"

    reports:
      - name: "Report with plaintext email body"
        dashboard_uid: "example-dashboard-uid"
        vars:
          team: "windows"
          env: "prd"
        from: "now-30d"
        to: "now"
        cron: "0 7 1 * *"    # 07:00 on the 1st day of each month
        email:
          to: ["ops@example.com", "sre@example.com"]
          subject: "Report with plaintext email body – {{ period_from_human }} → {{ period_to_human }}"
          body: |
            Hi,
            monthly report for team {{ vars.team }} (env {{ vars.env }}).
            Period: {{ period_from_human }} – {{ period_to_human }}.
          filename_prefix: "<name_of_the_report>"

      - name: "Report with rich HTML email body"
        dashboard_uid: "example-dashboard-uid"
        #vars:
        #  team: "windows"
        #  env: "prd"
        from: "now-30d"
        to: "now"
        cron: "0 7 1 * *"    # 07:00 on the 1st day of each month
        email:
          to: ["ops@example.com"]
          subject: "Report with rich HTML email body - {{ name }} weekly"
          body: "See attachment."
          filename_prefix: "<name_of_the_report>"
          body_html: |
            <div style="font-family:sans-serif">
              <img src="cid:logo.png" alt="Logo" width="180" />
              <p>Period: {{ period_from_human }} → {{ period_to_human }}</p>
            </div>
