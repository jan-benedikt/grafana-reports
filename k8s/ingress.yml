---
apiVersion: "traefik.io/v1alpha1"
kind: Middleware
metadata:
  name: http-redirect
  namespace: grafana-reports
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: "traefik.io/v1alpha1"
kind: Middleware
metadata:
  name: strip-pdf-export
  namespace: grafana-reports
spec:
  stripPrefix:
    prefixes:
      - /pdf-export
---
apiVersion: "traefik.io/v1alpha1"
kind: Middleware
metadata:
  name: add-forwarded-prefix
  namespace: grafana-reports
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Prefix: /pdf-export
---
apiVersion: "traefik.io/v1alpha1"
kind: "IngressRoute"
metadata:
  name: grafana-reports-http
  namespace: grafana-reports
spec:
  entryPoints:
    - web
  routes:
    - kind: "Rule"
      match: "Host(`grafana.example.com`) && PathPrefix(`/pdf-export/`)"
      priority: 20
      middlewares:
        - name: http-redirect
      services:
        - name: grafana-reports
          port: 8080
---
apiVersion: "traefik.io/v1alpha1"
kind: "IngressRoute"
metadata:
  name: grafana-reports-https
  namespace: grafana-reports
spec:
  entryPoints:
    - websecure
  routes:
    - kind: "Rule"
      match: "Host(`grafana.example.com`) && PathPrefix(`/pdf-export/`)"
      priority: 30
      middlewares:
        - name: strip-pdf-export
        - name: add-forwarded-prefix
      services:
        - name: grafana-reports
          port: 8080
  tls:
    secretName: grafana-tls