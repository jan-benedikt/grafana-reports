apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-reports
  namespace: grafana-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-reports
  template:
    metadata:
      labels:
        app: grafana-reports
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: grafana-reports
          image: ghcr.io/jan-benedikt/grafana-reports:v1.1.0
          imagePullPolicy: IfNotPresent
          args: ["--daemon", "--api-port", "8080"]
          envFrom:
            - secretRef:
                name: grafana-reports-secrets
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: reports-config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            - name: pdf-tmp
              mountPath: /tmp/pdfs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            # Chromium can saturate the CPU limit during large renders; the
            # default 1s probe timeout would restart the pod mid-render.
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              # Large dashboards were measured at ~1 GiB Chromium RSS per render;
              # two concurrent renders need headroom above 2Gi.
              memory: 3Gi
      terminationGracePeriodSeconds: 60
      volumes:
        - name: reports-config
          configMap:
            name: grafana-reports-config
        - name: pdf-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
