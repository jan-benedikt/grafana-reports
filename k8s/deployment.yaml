apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-reports
  namespace: grafana-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-reports
  template:
    metadata:
      labels:
        app: grafana-reports
    spec:
      containers:
        - name: grafana-reports
          image: ghcr.io/jan-benedikt/grafana-reports:latest
          imagePullPolicy: IfNotPresent
          args: ["--daemon", "--api-port", "8080"]
          envFrom:
            - secretRef:
                name: grafana-reports-secrets
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: reports-config
              mountPath: /app/config.yml
              subPath: config.yml
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: reports-config
          configMap:
            name: grafana-reports-config
