apiVersion: v1
kind: Secret
metadata:
  name: grafana-reports-secrets
  namespace: grafana-reports
type: Opaque
stringData:
  GRAFANA_URL: "https://grafana.example.com"
  GRAFANA_USER: "report-user"
  GRAFANA_PASSWORD: "change-me"
  GRAFANA_ORG_ID: "1"
  EMAIL_BACKEND: "sendgrid"
  SENDGRID_API_KEY: "sg.xxxxxx"
  SENDGRID_FROM: "Grafana Reports <noreply@example.com>"
  REPORTS_EMAIL_ENABLED: "true"
  PDF_OUTDIR: "/tmp/pdfs"
