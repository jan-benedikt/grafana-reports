apiVersion: v1
kind: Secret
metadata:
  name: grafana-reports-secrets
  namespace: grafana-reports
type: Opaque
stringData:
  GRAFANA_URL: "https://grafana.example.com"
  GRAFANA_USER: "report-user"
  GRAFANA_PASSWORD: "change-me"
  # Prefer a Grafana service-account token when possible:
  # GRAFANA_TOKEN: "glsa_xxxxxxxx"
  GRAFANA_ORG_ID: "1"
  API_KEYS: "replace-with-long-random-api-key"
  EMAIL_BACKEND: "sendgrid"
  SENDGRID_API_KEY: "sg.xxxxxx"
  SENDGRID_FROM: "Grafana Reports <noreply@example.com>"
  REPORTS_EMAIL_ENABLED: "true"
  PDF_OUTDIR: "/tmp/pdfs"
  PDF_SIZE_MODE: "paged"
  PDF_DEVICE_SCALE_FACTOR: "2"
  PDF_THEME: "light"
  QUEUE_MAX_PENDING: "10"
  LOG_LEVEL: "INFO"
  DEBUG_RENDER: "false"
